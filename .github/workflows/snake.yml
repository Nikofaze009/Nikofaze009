name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write  # ✅ Gives permission to push to the output branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # ✅ Prevents token issues

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Nikofaze009
          outputs: dist/snake.svg dist/snake-dark.svg?palette=github-dark

      - name: Push generated files to output branch
        run: |
          mkdir -p dist
          cp dist/snake.svg dist/snake-dark.svg dist/ 2>/dev/null || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B output
          cp -r dist/* .
          git add .
          git commit -m "Generate snake animation" || echo "No changes to commit"
          git push origin output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
